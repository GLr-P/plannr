# Builds Plannr on GitHub's Windows machines on every push and pull request: typecheck, unit tests, and an
# (unsigned) installer you can download from the run. Releases are published from the owner's PC.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # releases aren't code-signed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build the installer
        run: |
          npx electron-vite build
          npx electron-builder --win nsis --publish never

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: release/Plannr-Setup-*.exe
          if-no-files-found: error
